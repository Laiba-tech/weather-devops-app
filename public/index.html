<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🌤 Weather App</h1>

    <div class="search-box">
        <input id="cityInput" placeholder="Search city..." />
        <button id="searchBtn">Search</button>
    </div>

    <div id="loading" class="loading hidden">⏳ Fetching weather...</div>
    <div id="error" class="error hidden"></div>

    <div id="weatherCard" class="weather-card hidden">
        <h2 class="city-name"></h2>
        <img id="weatherIcon" alt="Weather Icon" />

        <h1 class="temperature"></h1>
        <p class="description"></p>

        <div class="details">
            <div>💧 <span id="humidity"></span>%</div>
            <div>💨 <span id="wind"></span> m/s</div>
            <div>🌡 Feels: <span id="feelsLike"></span>°C</div>
        </div>
    </div>

    <div id="history" class="history hidden">
        <h3>Recent Searches</h3>
        <ul id="historyList"></ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
